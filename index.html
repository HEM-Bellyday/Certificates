<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hem Bellyday — Certificates</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --white: #FFFFFF;
    --mist: #F3F7FD;
    --line: #DCE5F5;
    --cobalt: #1F4FD8;
    --cobalt-deep: #173CA8;
    --navy: #0E2A5C;
    --muted: #5B6B8C;
    --radius-lg: 20px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--white); }
  body {
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--navy);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Header band */
  header {
    background: var(--cobalt);
    color: var(--white);
    padding: calc(64px + env(safe-area-inset-top, 0px)) 24px 96px;
    position: relative;
    overflow: hidden;
  }
  header::after {            /* soft seal ring, the one decorative gesture */
    content: "";
    position: absolute;
    right: -120px; top: -120px;
    width: 420px; height: 420px;
    border-radius: 50%;
    border: 56px solid rgba(255,255,255,0.07);
  }
  .wrap { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  h1 {
    font-family: "DM Serif Display", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  header p {
    margin-top: 14px;
    font-size: 1.05rem;
    color: rgba(255,255,255,0.82);
    max-width: 46ch;
  }

  /* List */
  main {
    padding: 0 24px calc(64px + env(safe-area-inset-bottom, 0px));
  }
  .list {
    max-width: 760px;
    margin: -56px auto 0;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: 0 18px 40px -24px rgba(14,42,92,0.35);
    overflow: hidden;
    position: relative;
    z-index: 2;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    padding: 22px 24px;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--line);
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: background .15s ease;
  }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--mist); }
  .item:focus-visible { outline: 3px solid var(--cobalt); outline-offset: -3px; }

  .badge {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--mist);
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    color: var(--cobalt);
  }
  .badge svg { width: 22px; height: 22px; }
  .text { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 1.08rem; }
  .meta { color: var(--muted); font-size: .92rem; margin-top: 2px; overflow-wrap: anywhere; }
  .view {
    flex: none;
    font-weight: 600;
    font-size: .92rem;
    color: var(--cobalt);
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }
  .item:hover .view { background: var(--cobalt); color: var(--white); border-color: var(--cobalt); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: .88rem;
    margin-top: 28px;
  }

  /* Viewer */
  dialog {
    border: 0;
    padding: 0;
    width: min(960px, 94vw);
    height: min(88vh, 900px);
    margin: auto;
    border-radius: var(--radius-lg);
    background: var(--white);
    box-shadow: 0 30px 80px -20px rgba(14,42,92,0.5);
    overflow: hidden;
  }
  dialog::backdrop { background: rgba(14,42,92,0.55); backdrop-filter: blur(3px); }
  .viewer { display: flex; flex-direction: column; height: 100%; }
  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .bar h2 { flex: 1; font-size: 1rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    font: inherit; font-weight: 600; font-size: .9rem;
    padding: 8px 14px; border-radius: 999px;
    text-decoration: none; cursor: pointer;
    border: 1px solid var(--line); background: var(--white); color: var(--navy);
  }
  .btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--white); }
  .btn.primary:hover { background: var(--cobalt-deep); }
  .btn:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  iframe { flex: 1; width: 100%; border: 0; background: var(--mist); }

  @media (max-width: 560px) {
    header { padding-bottom: 84px; }
    .item { padding: 18px; gap: 14px; }
    .view { display: none; }
    dialog { width: 100vw; height: 100%; max-height: 100%; border-radius: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Hem Bellyday</h1>
    <p>Certificates in programming, finance, and applied AI.</p>
  </div>
</header>

<main>
  <div class="list" id="list"></div>
  <footer>Select a certificate to view it.</footer>
</main>

<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="viewer">
    <div class="bar">
      <h2 id="viewer-title"></h2>
      <a class="btn primary" id="open-tab" target="_blank" rel="noopener">Open PDF</a>
      <button class="btn" id="close" type="button">Close</button>
    </div>
    <iframe id="frame" title="Certificate PDF"></iframe>
  </div>
</dialog>

<script>
  /* Edit this list to add or rename certificates.
     PDFs go in a folder named "certificates" next to this file. */
  const certificates = [
    {
      title: "Python Foundation",
      meta: "Credential ID ANBPTMD12024026",
      file: "Certificate of Completion_Hem Bellyday_ANBPTMD12024026.pdf"
    },
    {
      title: "Quantitative Finance with SAS",
      meta: "SAS",
      file: "Quantitative_Finance_SAS.pdf"
    },
    {
      title: "Financial Decision Analysis",
      meta: "Finance",
      file: "Financial_Decision_Analysis.pdf"
    },
    {
      title: "AI Farm",
      meta: "Artificial intelligence",
      file: "AI_Farm.pdf"
    },
    {
      title: "Certificate",
      meta: "Hem Bellyday",
      file: "Bellyday HEM.pdf"
    }
  ];

  const folder = "certificates/";
  const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 13.8 7 22l5-3 5 3-1.5-8.2"/></svg>';

  const list = document.getElementById("list");
  const dialog = document.getElementById("viewer");
  const frame = document.getElementById("frame");
  const titleEl = document.getElementById("viewer-title");
  const openTab = document.getElementById("open-tab");

  certificates.forEach(cert => {
    const url = encodeURI(folder + cert.file);
    const btn = document.createElement("button");
    btn.className = "item";
    btn.type = "button";
    btn.innerHTML = `
      <span class="badge" aria-hidden="true">${icon}</span>
      <span class="text">
        <span class="title"></span>
        <span class="meta"></span>
      </span>
      <span class="view">View</span>`;
    btn.querySelector(".title").textContent = cert.title;
    btn.querySelector(".meta").textContent = cert.meta;
    btn.querySelector(".title").style.display = "block";
    btn.querySelector(".meta").style.display = "block";
    btn.addEventListener("click", () => openViewer(cert.title, url));
    list.appendChild(btn);
  });

  function openViewer(title, url) {
    // Phones often can't show PDFs inside a page, so open them directly
    if (window.matchMedia("(max-width: 560px)").matches) {
      window.open(url, "_blank", "noopener");
      return;
    }
    titleEl.textContent = title;
    openTab.href = url;
    frame.src = url;
    dialog.showModal();
  }

  document.getElementById("close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });
  dialog.addEventListener("close", () => { frame.src = "about:blank"; });
</script>
</body>
</html>
